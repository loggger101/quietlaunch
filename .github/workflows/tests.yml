name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is why this package exists; Linux is where the process-group
    # half of `_stop` runs, which nothing on the reference machine exercises.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.14"]
        # actions/python-versions builds 3.9 for Ubuntu 22.04 and 24.04 only,
        # and `ubuntu-latest` moved past them on 2026-10-19 (the same note as
        # spacecost's workflow), so the floor leg runs on 24.04.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q

  # .githooks/ holds samebytes' stat-cache hook (this tree lives in a synced
  # folder).  Drift, CRLF, a missing eol=lf pin or a missing executable bit
  # each make a copy silently useless after a checkout; this fails on any of
  # them.  The tag is the samebytes release the copies came from.
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Hooks match samebytes
        run: |
          python -m pip install "samebytes @ git+https://github.com/loggger101/samebytes@v0.1.0"
          python -m samebytes hooks check .
