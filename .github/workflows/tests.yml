name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is why this package exists; Linux is where the process-group
    # half of `_stop` runs, which nothing on the reference machine exercises.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.14"]
        # actions/python-versions builds 3.9 for Ubuntu 22.04 and 24.04 only,
        # and `ubuntu-latest` moved past them on 2026-10-19 (the same note as
        # spacecost's workflow), so the floor leg runs on 24.04.
        exclude:
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
