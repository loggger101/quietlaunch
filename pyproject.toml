[build-system]
# 77 is the first setuptools that reads PEP 639's `license = "MIT"` string and
# `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quietlaunch"
dynamic = ["version"]
description = "Start a Streamlit app with no console window: a small control window boots it, opens the browser when the port answers, reuses the server it started, and stops the whole process tree on close."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Logan M Edwards" }]
keywords = [
    "streamlit", "launcher", "windows", "pythonw", "tkinter",
    "no-console", "dashboard", "desktop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: User Interfaces",
]

# None, on purpose. The launcher is standard library only (tests hold it to
# that), and Streamlit is installed on first use by the launcher itself, into
# the interpreter that runs the app, which is the one that needs it.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/loggger101/quietlaunch"
Issues = "https://github.com/loggger101/quietlaunch/issues"
Changelog = "https://github.com/loggger101/quietlaunch/blob/main/CHANGELOG.md"

# A gui-script, so on Windows the installed `quietlaunch.exe` starts with no
# console, which is the point of the package.
[project.gui-scripts]
quietlaunch = "quietlaunch.launcher:main"

[tool.setuptools]
packages = ["quietlaunch"]

[tool.setuptools.dynamic]
version = { attr = "quietlaunch.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
